    <meta property="og:type" content="website" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Framosaic",
        "url": "https://joghurtsommelier.github.io/Framosaic/",
        "description": "Framosaic turns a photo into a grid of instant-film-sized tiles you print and reassemble into a wall mosaic.",

        "operatingSystem": "Any (runs in the browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!--
      Partial CSP: meta tags can't carry frame-ancestors, report-uri, or
      sandbox — those (plus the same directives below) are set as real HTTP
      response headers when hosting supports it (see netlify.toml/vercel.json).
      GitHub Pages, the default deploy target, does not support custom
      headers, so this meta tag is the baseline everywhere.
      style-src needs 'unsafe-inline': the crop tool (react-easy-crop) sets
      pan/zoom via inline element.style, not stylesheets — verified against
      a real browser console; script-src otherwise stays strict, only
      allowing Google's gtag.js loader — and even that only ever loads
      after explicit consent (see ConsentBanner/useAnalyticsConsent).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Framosaic — Turn a photo into a wall mosaic</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
